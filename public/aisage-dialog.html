<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>九宫先生 - 玄学全科 AI</title>
  <style>
    /* ===== 全局重置 ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0f;
      background-image: 
        radial-gradient(ellipse at 20% 50%, rgba(184,134,11,0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(59,130,246,0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(168,85,247,0.08) 0%, transparent 50%);
      color: #e5e7eb;
      display: flex;
      flex-direction: column;
    }

    /* ===== 星空背景 ===== */
    .starfield {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 0;
      overflow: hidden;
    }
    .starfield span {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: twinkle var(--duration) ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: var(--min-opacity); }
      50% { opacity: var(--max-opacity); }
    }

    /* ===== 主容器 ===== */
    .container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 640px;
      margin: 0 auto;
      padding: 0 16px;
      width: 100%;
    }

    /* ===== 头部 ===== */
    .header {
      text-align: center;
      padding: 40px 0 16px;
      flex-shrink: 0;
    }
    .header .icon { font-size: 36px; }
    .header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #f0d860;
      margin: 8px 0 4px;
      letter-spacing: 2px;
    }
    .header p {
      font-size: 12px;
      color: rgba(156, 163, 175, 0.7);
      letter-spacing: 4px;
    }
    .header .divider {
      width: 40px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #d4a843, transparent);
      margin: 12px auto 0;
    }

    /* ===== 消息区 ===== */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 8px 4px;
      scrollbar-width: thin;
      scrollbar-color: rgba(184,134,11,0.2) transparent;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: rgba(184,134,11,0.3); border-radius: 2px; }
    .msg { margin-bottom: 12px; display: flex; }
    .msg.user { justify-content: flex-end; }
    .msg .bubble {
      max-width: 88%;
      border-radius: 14px;
      padding: 10px 14px;
      line-height: 1.6;
      font-size: 14px;
    }
    .msg.user .bubble {
      background: rgba(184,134,11,0.15);
      border: 1px solid rgba(184,134,11,0.25);
      color: #a7f3d0;
    }
    .msg.ai .bubble {
      background: rgba(31,41,55,0.5);
      border: 1px solid rgba(55,65,81,0.3);
      color: #e5e7eb;
      backdrop-filter: blur(4px);
    }
    .msg .bubble .label {
      font-size: 11px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .msg.user .bubble .label { justify-content: flex-end; }
    .msg .bubble .label .badge {
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(184,134,11,0.2);
      color: #f0d860;
      border: 1px solid rgba(184,134,11,0.3);
    }
    .msg .bubble .text p { margin: 0; }
    .msg .bubble .text br { content: ''; display: block; margin: 6px 0; }

    /* ===== 加载动画 ===== */
    .loading {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 10px 14px;
      background: rgba(31,41,55,0.5);
      border: 1px solid rgba(55,65,81,0.3);
      border-radius: 14px;
      max-width: 88%;
      backdrop-filter: blur(4px);
    }
    .loading span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #d4a843;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .loading span:nth-child(2) { animation-delay: 0.2s; }
    .loading span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%,100%{opacity:0.2;transform:scale(0.8)} 50%{opacity:1;transform:scale(1)} }

    /* ===== 错误消息 ===== */
    .error-msg {
      text-align: center;
      background: rgba(220,38,38,0.15);
      border: 1px solid rgba(220,38,38,0.25);
      border-radius: 10px;
      padding: 8px 12px;
      margin: 8px auto;
    }
    .error-msg p { font-size: 12px; color: #f87171; }

    /* ===== 输入区 ===== */
    .input-area {
      flex-shrink: 0;
      padding: 12px 0 24px;
    }
    .input-row {
      display: flex;
      gap: 8px;
      background: rgba(17,24,39,0.6);
      border: 1px solid rgba(55,65,81,0.4);
      border-radius: 16px;
      padding: 6px 6px 6px 16px;
      backdrop-filter: blur(8px);
    }
    .input-row:focus-within {
      border-color: rgba(212,168,67,0.5);
      box-shadow: 0 0 20px rgba(212,168,67,0.12);
    }
    .input-row input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: #e5e7eb;
      font-size: 14px;
      padding: 8px 0;
    }
    .input-row input::placeholder { color: rgba(107,114,128,0.6); }
    .input-row button {
      width: 42px; height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #f0d860, #b8860b);
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .input-row button:hover { transform: scale(1.05); }
    .input-row button:active { transform: scale(0.95); }
    .input-row button:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

    /* ===== 底部文字 ===== */
    .footer-note {
      text-align: center;
      font-size: 9px;
      color: rgba(75,85,99,0.6);
      margin-top: 8px;
      letter-spacing: 1px;
    }


    /* ===== 北斗七星 ===== */
    .big-dipper {
      position: fixed;
      z-index: 1;
      pointer-events: none;
    }
    .big-dipper .star {
      position: absolute;
      border-radius: 50%;
      transition: all 0.3s;
    }
    .big-dipper .star::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      animation: halo-pulse 3s ease-in-out infinite;
    }
    @keyframes halo-pulse {
      0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 0.8; transform: translate(-50%, -50%) scale(2.5); }
    }
    .big-dipper .line {
      position: absolute;
      height: 2px;
      transform-origin: left center;
      opacity: 0.25;
    }

    /* ===== 流星 ===== */
    .shooting-star {
      position: fixed;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
    }
    .shooting-star::before {
      content: '';
      position: absolute;
      top: 0;
      width: 60px;
      height: 1px;
      background: linear-gradient(to left, rgba(255,255,255,0.8), transparent);
      transform: rotate(0deg);
      transform-origin: right center;
    }
    @keyframes shoot {
      0% { opacity: 0; transform: translateX(0) translateY(0); }
      5% { opacity: 1; }
      15% { opacity: 1; }
      20% { opacity: 0; }
      100% { opacity: 0; transform: translateX(-400px) translateY(200px); }
    }

    /* ===== 星晕背景（body） ===== */
    /* ===== 响应式 ===== */
    @media (max-width: 480px) {
      .header { padding: 24px 0 12px; }
      .header .icon { font-size: 28px; }
      .header h1 { font-size: 18px; }
      .msg .bubble { font-size: 13px; }
    }
  </style>
</head>

  <script>
    // ===== 生成星空 =====
    (function() {
      var starfield = document.getElementById('starfield');
      if (!starfield) return;
      for (var i = 0; i < 250; i++) {
        var star = document.createElement('span');
        var size = Math.random() * 2.8 + 0.3;
        size = Math.min(size, 3);
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.setProperty('--duration', (Math.random() * 5 + 3) + 's');
        star.style.setProperty('--min-opacity', Math.random() * 0.2 + 0.05);
        star.style.setProperty('--max-opacity', Math.random() * 0.7 + 0.3);
        star.style.animationDelay = Math.random() * 6 + 's';
        starfield.appendChild(star);
      }
    })();

    // ===== 北斗七星 =====
    (function() {
      // 北斗七星坐标 (百分比位置，相对于视口)
      var stars = [
        { x: 10, y: 20, size: 4.0, label: '天枢' },   // α
        { x: 20, y: 16, size: 3.8, label: '天璇' },   // β
        { x: 32, y: 14, size: 3.6, label: '天玑' },    // γ
        { x: 45, y: 16, size: 4.2, label: '天权' },    // δ
        { x: 58, y: 24, size: 3.8, label: '玉衡' },   // ε
        { x: 68, y: 34, size: 4.0, label: '开阳' },   // ζ
        { x: 78, y: 46, size: 4.5, label: '摇光' },   // η
      ];
      var container = document.getElementById('bigDipper');
      if (!container) return;

      // 连线
      for (var i = 0; i < stars.length - 1; i++) {
        var a = stars[i], b = stars[i+1];
        var dx = b.x - a.x, dy = b.y - a.y;
        var len = Math.sqrt(dx*dx + dy*dy);
        var angle = Math.atan2(dy, dx) * 180 / Math.PI;
        var line = document.createElement('div');
        line.className = 'line';
        line.style.cssText = 'width:' + len + 'vw;left:' + a.x + 'vw;top:' + a.y + 'vh;background:linear-gradient(90deg,rgba(255,255,255,0.4),rgba(255,255,255,0.1));transform:rotate(' + angle + 'deg);';
        container.appendChild(line);
      }

      // 七星
      stars.forEach(function(s, idx) {
        var star = document.createElement('div');
        star.className = 'star';
        var size = s.size * 3;
        star.style.cssText = 'left:' + s.x + 'vw;top:' + s.y + 'vh;width:' + size + 'px;height:' + size + 'px;background:radial-gradient(circle,rgba(255,255,255,1),rgba(200,220,255,0.6));box-shadow:0 0 ' + (size*2) + 'px rgba(200,220,255,0.4),0 0 ' + (size*4) + 'px rgba(200,220,255,0.15);';
        // 光晕
        var halo = document.createElement('div');
        halo.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:' + (size*3) + 'px;height:' + (size*3) + 'px;border-radius:50%;background:radial-gradient(circle,rgba(200,220,255,0.15),transparent);animation:halo-pulse ' + (3 + idx*0.5) + 's ease-in-out infinite;animation-delay:' + (idx*0.3) + 's;';
        star.appendChild(halo);

    function formatText(text) {
      var lines = text.split('\n');

        var line = lines[i].trim();

      }
      return out;

    function showLoading(v) {
      var el = document.getElementById('loadingMsg');
      if (el) el.remove();
      if (!v) return;
      var div = document.createElement('div');
      div.id = 'loadingMsg';
      div.className = 'msg ai';
      div.innerHTML = '<div class="loading"><span></span><span></span><span></span></div>';
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function showError(msg) {
      var el = document.getElementById('errorMsg');
      if (el) el.remove();
      if (!msg) return;
      var div = document.createElement('div');
      div.id = 'errorMsg';
      div.innerHTML = '<div class="error-msg"><p>⚠️ ' + escapeHtml(msg) + '</p></div>';
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function setLoadingState(v) {
      loading = v;
      input.disabled = v;
      sendBtn.disabled = v || !input.value.trim();
    }

    input.addEventListener('input', function() { sendBtn.disabled = loading || !input.value.trim(); });

    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); send(); }
    });

    sendBtn.addEventListener('click', send);

    async function send() {
      var text = input.value.trim();
      if (!text || loading) return;
      addMessage('user', text);
      input.value = '';
      setLoadingState(true);
      showLoading(true);
      showError('');

      var SYSTEM_PROMPT = '你是一位精通中国传统玄学全科的资深大师，名为"九宫先生"。你的知识涵盖四柱八字、紫微斗数、奇门遁甲、六爻、梅花易数、姓名学、风水学等领域。回复原则：专业准确、领域自判、通俗易懂、实用建议。关键术语用【】标注并解释。';

      try {
        var res = await fetch('https://aisage-api.4513.workers.dev/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: 'deepseek-chat',
            messages: [{role:'system',content:SYSTEM_PROMPT},{role:'user',content:text}],
            temperature: 0.7,
            max_tokens: 2048
          })
        });
        if (!res.ok) {
          var err = await res.text();
          throw new Error('请求失败: ' + res.status + ' ' + err);
        }
        var data = await res.json();
        if (data.choices && data.choices[0] && data.choices[0].message) {
          addMessage('assistant', data.choices[0].message.content);
        } else throw new Error('AI 回复为空');
      } catch (err) {
        showError(err.message);
      } finally {
        setLoadingState(false);
        showLoading(false);
        input.focus();
      }
    }

    input.focus();
