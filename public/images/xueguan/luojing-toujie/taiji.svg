<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <clipPath id="half">
      <rect x="100" y="0" width="100" height="200"/>
    </clipPath>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#333" stroke-width="2"/>
  <!-- Taiji (Yin-Yang) -->
  <circle cx="100" cy="100" r="80" fill="#fff" stroke="#333" stroke-width="1"/>
  <circle cx="100" cy="100" r="80" fill="#000" clip-path="url(#half)"/>
  <circle cx="100" cy="60" r="40" fill="#fff"/>
  <circle cx="100" cy="140" r="40" fill="#000"/>
  <circle cx="100" cy="60" r="12" fill="#000"/>
  <circle cx="100" cy="140" r="12" fill="#fff"/>
  <!-- Compass needle -->
  <line x1="100" y1="10" x2="100" y2="190" stroke="#c00" stroke-width="3"/>
  <polygon points="100,5 95,20 105,20" fill="#c00"/>
  <text x="100" y="22" text-anchor="middle" font-size="10" fill="#c00">N</text>
  <!-- Outer ring labels -->
  <text x="100" y="198" text-anchor="middle" font-size="9" fill="#666">罗经天池</text>
</svg>
