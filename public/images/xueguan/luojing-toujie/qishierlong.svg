<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <circle cx="200" cy="200" r="180" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="200" cy="200" r="150" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <circle cx="200" cy="200" r="120" fill="none" stroke="#ccc" stroke-width="1"/>
  <!-- 24 divisions with labels - simplified -->
  <g font-size="10" text-anchor="middle">
    <!-- 子 -->
    <text x="200" y="30" fill="#c00" font-size="12">子</text>
    <text x="194" y="44" fill="#999" font-size="8">庚子</text>
    <text x="200" y="54" fill="#999" font-size="8">壬子</text>
    <!-- 癸 -->
    <text x="212" y="30" transform="rotate(15,212,30)" fill="#333">癸</text>
    <!-- 丑 -->
    <text x="260" y="60" transform="rotate(30,260,60)" fill="#333">丑</text>
    <!-- 艮 -->
    <text x="280" y="95" transform="rotate(45,280,95)" fill="#333">艮</text>
    <!-- 寅 -->
    <text x="292" y="135" transform="rotate(60,292,135)" fill="#333">寅</text>
    <!-- 甲 -->
    <text x="295" y="180" transform="rotate(75,295,180)" fill="#333">甲</text>
    <!-- 卯 -->
    <text x="360" y="202" fill="#333">卯</text>
    <!-- 乙 -->
    <text x="345" y="240" transform="rotate(105,345,240)" fill="#333">乙</text>
    <!-- 辰 -->
    <text x="315" y="275" transform="rotate(120,315,275)" fill="#333">辰</text>
    <!-- 巽 -->
    <text x="285" y="305" transform="rotate(135,285,305)" fill="#333">巽</text>
    <!-- 巳 -->
    <text x="250" y="325" transform="rotate(150,250,325)" fill="#333">巳</text>
    <!-- 丙 -->
    <text x="205" y="340" transform="rotate(165,205,340)" fill="#333">丙</text>
    <!-- 午 -->
    <text x="200" y="365" fill="#c00" font-size="12">午</text>
    <!-- 丁 -->
    <text x="192" y="340" transform="rotate(195,192,340)" fill="#333">丁</text>
    <!-- 未 -->
    <text x="145" y="320" transform="rotate(210,145,320)" fill="#333">未</text>
    <!-- 坤 -->
    <text x="115" y="290" transform="rotate(225,115,290)" fill="#333">坤</text>
    <!-- 申 -->
    <text x="95" y="255" transform="rotate(240,95,255)" fill="#333">申</text>
    <!-- 庚 -->
    <text x="90" y="210" transform="rotate(255,90,210)" fill="#333">庚</text>
    <!-- 酉 -->
    <text x="40" y="202" fill="#333">酉</text>
    <!-- 辛 -->
    <text x="55" y="170" transform="rotate(285,55,170)" fill="#333">辛</text>
    <!-- 戌 -->
    <text x="80" y="130" transform="rotate(300,80,130)" fill="#333">戌</text>
    <!-- 乾 -->
    <text x="110" y="95" transform="rotate(315,110,95)" fill="#333">乾</text>
    <!-- 亥 -->
    <text x="145" y="65" transform="rotate(330,145,65)" fill="#333">亥</text>
    <!-- 壬 -->
    <text x="185" y="30" transform="rotate(345,185,30)" fill="#333">壬</text>
  </g>
  <!-- Inner circle with 3-per-mountain markings -->
  <g stroke="#999" stroke-width="0.5">
    <!-- Division lines at each 5 degrees -->
    <line x1="200" y1="60" x2="200" y2="80"/>
    <line x1="200" y1="320" x2="200" y2="340"/>
    <!-- more would be added in full version -->
  </g>
  <text x="200" y="15" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">穿山七十二龙</text>
  <text x="200" y="390" text-anchor="middle" font-size="11" fill="#666">每山分三龙，共72龙</text>
</svg>
