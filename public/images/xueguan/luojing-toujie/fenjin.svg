  <text x="70" y="322" font-size="11" fill="#333">旺（吉）</text>
  <rect x="130" y="310" width="12" height="12" fill="#fa0"/>
  <text x="150" y="322" font-size="11" fill="#333">相（次吉）</text>
  <rect x="210" y="310" width="12" height="12" fill="#ccc"/>
  <text x="230" y="322" font-size="11" fill="#333">孤虚（避）</text>
  <rect x="290" y="310" width="12" height="12" fill="#999"/>
  <text x="310" y="322" font-size="11" fill="#333">空亡（凶）</text>
  <text x="200" y="365" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">七十二龙分金旺相孤虚图</text>
