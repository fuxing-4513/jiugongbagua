<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380">
  <circle cx="200" cy="180" r="160" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="200" cy="180" r="130" fill="none" stroke="#999" stroke-width="1"/>
  <circle cx="200" cy="180" r="100" fill="none" stroke="#ccc" stroke-width="1"/>
  <circle cx="200" cy="180" r="40" fill="none" stroke="#f0f0f0" stroke-width="1"/>
  <!-- Simplified 24 mountains labels -->
  <g font-size="11" text-anchor="middle">
    <text x="200" y="28" fill="#c00" font-size="13">子</text>
    <text x="200" y="346" fill="#c00" font-size="13">午</text>
