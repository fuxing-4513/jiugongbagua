<text x="270" y="166" text-anchor="middle" font-size="12" fill="#6b5b43" font-family="serif">城墙之土·厚重可靠</text>
<rect x="30" y="176" width="420" height="23" rx="5" fill="#f5efe2" stroke="#d8c9a3" stroke-width="0.8"/>
