<text x="140" y="88" text-anchor="middle" font-size="12.5" fill="#5a4632" font-family="serif">阴木</text>
<text x="270" y="88" text-anchor="middle" font-size="12" fill="#6b5b43" font-family="serif">花草藤蔓·柔韧生长</text>
