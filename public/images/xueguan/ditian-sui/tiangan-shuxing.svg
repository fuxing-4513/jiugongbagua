<text x="270" y="192" text-anchor="middle" font-size="12" fill="#6b5b43" font-family="serif">田园之土·滋养包容</text>
<rect x="30" y="202" width="420" height="23" rx="5" fill="#faf7f0" stroke="#d8c9a3" stroke-width="0.8"/>
