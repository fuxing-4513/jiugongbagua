<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
<text x="240" y="26" text-anchor="middle" font-size="17" fill="#5a4632" font-family="serif" font-weight="bold">八格与体用</text>
<rect x="30" y="52" width="420" height="24" rx="5" fill="#faf7f0" stroke="#d8c9a3" stroke-width="0.8"/>
<text x="100" y="68.5" text-anchor="middle" font-size="14" fill="#8c6d1f" font-family="serif">正官格</text>
<text x="290" y="68.5" text-anchor="middle" font-size="12" fill="#5a4632" font-family="serif">以官为用·印绶护官</text>
<rect x="30" y="79" width="420" height="24" rx="5" fill="#f5efe2" stroke="#d8c9a3" stroke-width="0.8"/>
<text x="100" y="95.5" text-anchor="middle" font-size="14" fill="#8c6d1f" font-family="serif">七杀格</text>
<text x="290" y="95.5" text-anchor="middle" font-size="12" fill="#5a4632" font-family="serif">杀须食制·或印化杀</text>
<rect x="30" y="106" width="420" height="24" rx="5" fill="#faf7f0" stroke="#d8c9a3" stroke-width="0.8"/>
<text x="100" y="122.5" text-anchor="middle" font-size="14" fill="#8c6d1f" font-family="serif">正财格</text>
<text x="290" y="122.5" text-anchor="middle" font-size="12" fill="#5a4632" font-family="serif">财喜食生·身旺任财</text>
<rect x="30" y="133" width="420" height="24" rx="5" fill="#f5efe2" stroke="#d8c9a3" stroke-width="0.8"/>
<text x="100" y="149.5" text-anchor="middle" font-size="14" fill="#8c6d1f" font-family="serif">偏财格</text>
<text x="290" y="149.5" text-anchor="middle" font-size="12" fill="#5a4632" font-family="serif">偏财豪迈·喜比劫助</text>
<rect x="30" y="160" width="420" height="24" rx="5" fill="#faf7f0" stroke="#d8c9a3" stroke-width="0.8"/>
<text x="100" y="176.5" text-anchor="middle" font-size="14" fill="#8c6d1f" font-family="serif">正印格</text>
<text x="290" y="176.5" text-anchor="middle" font-size="12" fill="#5a4632" font-family="serif">印绶护身·喜官杀生</text>
<rect x="30" y="187" width="420" height="24" rx="5" fill="#f5efe2" stroke="#d8c9a3" stroke-width="0.8"/>
<text x="100" y="203.5" text-anchor="middle" font-size="14" fill="#8c6d1f" font-family="serif">偏印格</text>
<text x="290" y="203.5" text-anchor="middle" font-size="12" fill="#5a4632" font-family="serif">枭神夺食·忌见食神</text>
<rect x="30" y="214" width="420" height="24" rx="5" fill="#faf7f0" stroke="#d8c9a3" stroke-width="0.8"/>
<text x="100" y="230.5" text-anchor="middle" font-size="14" fill="#8c6d1f" font-family="serif">食神格</text>
<text x="290" y="230.5" text-anchor="middle" font-size="12" fill="#5a4632" font-family="serif">食神生财·身强为佳</text>
<rect x="30" y="241" width="420" height="24" rx="5" fill="#f5efe2" stroke="#d8c9a3" stroke-width="0.8"/>
<text x="100" y="257.5" text-anchor="middle" font-size="14" fill="#8c6d1f" font-family="serif">伤官格</text>
<text x="290" y="257.5" text-anchor="middle" font-size="12" fill="#5a4632" font-family="serif">伤官配印·驾杀为贵</text>
</svg>