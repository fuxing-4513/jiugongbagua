<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" fill="none">
  <defs>
    <!-- 星星发光滤镜 -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 大星光晕 -->
    <filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="blur2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="40" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 金色径向渐变光晕 -->
    <radialGradient id="goldHalo" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.18"/>
      <stop offset="30%" stop-color="#fbbf24" stop-opacity="0.08"/>
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="beidouHalo" cx="55%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fcd34d" stop-opacity="0.25"/>
      <stop offset="25%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="polarisHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fefce8" stop-opacity="0.35"/>
      <stop offset="20%" stop-color="#fef3c7" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaGrad" cx="40%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#0f0f1a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="40%" stop-color="#0a0a1a"/>
      <stop offset="70%" stop-color="#0d0d24"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
  </defs>

  <!-- 深空底色 -->
  <rect width="1440" height="900" fill="url(#skyGrad)"/>

  <!-- 星云渐变（中右区域） -->
  <rect width="1440" height="900" fill="url(#nebulaGrad)"/>

  <!-- 北斗七星区域的大光晕 -->
  <ellipse cx="850" cy="480" rx="350" ry="280" fill="url(#beidouHalo)"/>

  <!-- 北极星区域光晕 -->
  <circle cx="760" cy="180" r="200" fill="url(#polarisHalo)"/>

  <!-- 散布金色光晕（页面各处） -->
  <circle cx="200" cy="250" r="180" fill="url(#goldHalo)" opacity="0.4"/>
  <circle cx="1200" cy="650" r="200" fill="url(#goldHalo)" opacity="0.3"/>
  <circle cx="600" cy="750" r="150" fill="url(#goldHalo)" opacity="0.25"/>

  <!-- 散布群星 -->
  <g fill="#fcd34d">
    <!-- 亮星 -->
    <circle cx="50" cy="80" r="1.2" opacity="0.5"/><circle cx="130" cy="35" r="0.8" opacity="0.4"/>
    <circle cx="210" cy="120" r="1.4" opacity="0.55"/><circle cx="340" cy="60" r="0.7" opacity="0.35"/>
    <circle cx="420" cy="180" r="1.1" opacity="0.5"/><circle cx="560" cy="90" r="1.0" opacity="0.45"/>
    <circle cx="680" cy="50" r="1.3" opacity="0.55"/><circle cx="750" cy="30" r="0.6" opacity="0.3"/>
    <circle cx="830" cy="80" r="0.9" opacity="0.4"/><circle cx="920" cy="200" r="1.5" opacity="0.6"/>
    <circle cx="1060" cy="110" r="0.8" opacity="0.35"/><circle cx="1120" cy="250" r="1.2" opacity="0.5"/>
    <circle cx="80" cy="300" r="1.0" opacity="0.45"/><circle cx="200" cy="380" r="0.7" opacity="0.3"/>
    <circle cx="310" cy="260" r="1.2" opacity="0.5"/><circle cx="500" cy="350" r="0.9" opacity="0.4"/>
    <circle cx="640" cy="280" r="1.1" opacity="0.5"/><circle cx="780" cy="400" r="0.8" opacity="0.35"/>
    <circle cx="880" cy="320" r="1.3" opacity="0.55"/><circle cx="1000" cy="450" r="1.0" opacity="0.45"/>
    <circle cx="1150" cy="380" r="0.7" opacity="0.3"/><circle cx="150" cy="500" r="1.1" opacity="0.5"/>
    <circle cx="270" cy="580" r="0.8" opacity="0.35"/><circle cx="400" cy="490" r="0.9" opacity="0.4"/>
    <circle cx="550" cy="620" r="1.2" opacity="0.5"/><circle cx="700" cy="530" r="0.7" opacity="0.3"/>
    <circle cx="850" cy="650" r="1.0" opacity="0.45"/><circle cx="950" cy="560" r="1.1" opacity="0.5"/>
    <circle cx="1080" cy="700" r="0.9" opacity="0.4"/><circle cx="60" cy="720" r="0.8" opacity="0.35"/>
    <circle cx="350" cy="750" r="1.0" opacity="0.45"/><circle cx="600" cy="780" r="0.7" opacity="0.3"/>
    <circle cx="900" cy="760" r="1.2" opacity="0.5"/><circle cx="1150" cy="720" r="0.6" opacity="0.25"/>
    <circle cx="170" cy="670" r="0.8" opacity="0.35"/><circle cx="480" cy="710" r="0.9" opacity="0.4"/>
    <!-- 微星 -->
    <circle cx="30" cy="160" r="0.4" opacity="0.25"/><circle cx="290" cy="420" r="0.5" opacity="0.3"/>
    <circle cx="450" cy="100" r="0.4" opacity="0.25"/><circle cx="720" cy="680" r="0.5" opacity="0.3"/>
    <circle cx="810" cy="240" r="0.4" opacity="0.25"/><circle cx="1020" cy="600" r="0.5" opacity="0.3"/>
    <circle cx="170" cy="220" r="0.5" opacity="0.3"/><circle cx="620" cy="450" r="0.4" opacity="0.25"/>
    <circle cx="520" cy="510" r="0.5" opacity="0.3"/><circle cx="960" cy="130" r="0.4" opacity="0.25"/>
    <circle cx="110" cy="450" r="0.5" opacity="0.3"/><circle cx="380" cy="640" r="0.4" opacity="0.25"/>
    <circle cx="760" cy="730" r="0.5" opacity="0.3"/><circle cx="1040" cy="280" r="0.4" opacity="0.25"/>
    <circle cx="1300" cy="150" r="0.5" opacity="0.25"/><circle cx="1250" cy="500" r="0.4" opacity="0.2"/>
    <circle cx="1340" cy="350" r="0.5" opacity="0.3"/><circle cx="280" cy="140" r="0.4" opacity="0.2"/>
    <circle cx="100" cy="600" r="0.5" opacity="0.25"/><circle cx="650" cy="150" r="0.4" opacity="0.2"/>
    <circle cx="1180" cy="850" r="0.5" opacity="0.3"/><circle cx="1400" cy="780" r="0.4" opacity="0.2"/>
  </g>

  <!-- ===== 北斗七星 ===== -->
  <!-- 连线（虚线+实线叠层） -->
  <g stroke="#fcd34d" stroke-width="1.0" opacity="0.2" fill="none" stroke-dasharray="5 8">
    <line x1="750" y1="420" x2="800" y2="450"/>
    <line x1="800" y1="450" x2="860" y2="470"/>
    <line x1="860" y1="470" x2="900" y2="520"/>
    <line x1="900" y1="520" x2="830" y2="560"/>
    <line x1="830" y1="560" x2="860" y2="630"/>
    <line x1="860" y1="630" x2="890" y2="650"/>
    <line x1="860" y1="630" x2="920" y2="690"/>
    <!-- 天枢→北极星 -->
    <line x1="750" y1="420" x2="760" y2="180" opacity="0.12" stroke-dasharray="2 10"/>
  </g>

  <!-- ===== 七星星点（带光晕）===== -->
  <g filter="url(#bigGlow)">
    <!-- 天枢（贪狼）- 勺口第一颗 -->
    <circle cx="750" cy="420" r="5" fill="#fef3c7" opacity="0.95"/>
    <circle cx="750" cy="420" r="12" fill="#fbbf24" opacity="0.3"/>
    <circle cx="750" cy="420" r="20" fill="#f59e0b" opacity="0.12"/>

    <!-- 天璇（巨门） -->
    <circle cx="800" cy="450" r="4.5" fill="#fef3c7" opacity="0.9"/>
    <circle cx="800" cy="450" r="10" fill="#fbbf24" opacity="0.25"/>
    <circle cx="800" cy="450" r="18" fill="#f59e0b" opacity="0.1"/>

    <!-- 天玑（禄存） -->
    <circle cx="860" cy="470" r="4.5" fill="#fef3c7" opacity="0.9"/>
    <circle cx="860" cy="470" r="10" fill="#fbbf24" opacity="0.25"/>
    <circle cx="860" cy="470" r="18" fill="#f59e0b" opacity="0.1"/>

    <!-- 天权（文曲） -->
    <circle cx="900" cy="520" r="3.5" fill="#fef3c7" opacity="0.8"/>
    <circle cx="900" cy="520" r="8" fill="#fbbf24" opacity="0.2"/>
    <circle cx="900" cy="520" r="15" fill="#f59e0b" opacity="0.08"/>

    <!-- 玉衡（廉贞）- 勺柄第一颗，最亮 -->
    <circle cx="830" cy="560" r="5.5" fill="#fefce8" opacity="1"/>
    <circle cx="830" cy="560" r="14" fill="#fbbf24" opacity="0.35"/>
    <circle cx="830" cy="560" r="25" fill="#f59e0b" opacity="0.15"/>

    <!-- 开阳（武曲） -->
    <circle cx="860" cy="630" r="4" fill="#fef3c7" opacity="0.85"/>
    <circle cx="860" cy="630" r="9" fill="#fbbf24" opacity="0.22"/>
    <circle cx="860" cy="630" r="16" fill="#f59e0b" opacity="0.09"/>

    <!-- 辅（破军伴星） -->
    <circle cx="890" cy="650" r="2.5" fill="#fcd34d" opacity="0.65"/>
    <circle cx="890" cy="650" r="6" fill="#fcd34d" opacity="0.15"/>

    <!-- 摇光（破军）- 勺柄末 -->
    <circle cx="920" cy="690" r="3.5" fill="#fef3c7" opacity="0.8"/>
    <circle cx="920" cy="690" r="9" fill="#fbbf24" opacity="0.2"/>
    <circle cx="920" cy="690" r="16" fill="#f59e0b" opacity="0.08"/>
  </g>

  <!-- ===== 北极星（帝星）===== -->
  <g filter="url(#bigGlow)">
    <!-- 外晕 -->
    <circle cx="760" cy="180" r="30" fill="#fef3c7" opacity="0.08"/>
    <circle cx="760" cy="180" r="18" fill="#fef3c7" opacity="0.15"/>
    <circle cx="760" cy="180" r="8" fill="#fefce8" opacity="0.3"/>
    <!-- 星点 -->
    <circle cx="760" cy="180" r="5" fill="#ffffff" opacity="1"/>
    <circle cx="760" cy="180" r="2.5" fill="#ffffff" opacity="1"/>
    <!-- 十字星光 -->
    <line x1="760" y1="165" x2="760" y2="195" stroke="#fefce8" stroke-width="1.0" opacity="0.6"/>
    <line x1="745" y1="180" x2="775" y2="180" stroke="#fefce8" stroke-width="1.0" opacity="0.6"/>
    <!-- 对角星光 -->
    <line x1="749" y1="169" x2="771" y2="191" stroke="#fefce8" stroke-width="0.5" opacity="0.3"/>
    <line x1="771" y1="169" x2="749" y2="191" stroke="#fefce8" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- 右下角淡八卦图 -->
  <g transform="translate(1260, 700) scale(0.7)" opacity="0.035">
    <circle cx="50" cy="50" r="50" stroke="#fbbf24" stroke-width="2"/>
    <path d="M50,0 A25,25 0 0,1 50,50 A25,25 0 0,0 50,100 A50,50 0 0,1 50,0" fill="#fbbf24"/>
    <circle cx="50" cy="25" r="8" fill="#050510"/>
    <circle cx="50" cy="75" r="8" fill="#fbbf24"/>
  </g>
</svg>
