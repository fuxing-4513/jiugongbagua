<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 深空背景 -->
  <rect width="1200" height="800" fill="url(#skyGrad)"/>

  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="60%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>

  <!-- 散布星点 -->
  <g opacity="0.4" fill="#fcd34d">
    <!-- 随机散布小星 -->
    <circle cx="50" cy="80" r="1.0"/><circle cx="130" cy="30" r="0.8"/><circle cx="210" cy="120" r="1.2"/>
    <circle cx="340" cy="55" r="0.7"/><circle cx="420" cy="180" r="1.0"/><circle cx="560" cy="90" r="0.9"/>
    <circle cx="680" cy="40" r="1.1"/><circle cx="750" cy="160" r="0.6"/><circle cx="830" cy="70" r="0.8"/>
    <circle cx="920" cy="200" r="1.3"/><circle cx="1060" cy="110" r="0.7"/><circle cx="1120" cy="250" r="1.0"/>
    <circle cx="80" cy="300" r="0.9"/><circle cx="200" cy="380" r="0.6"/><circle cx="310" cy="250" r="1.1"/>
    <circle cx="500" cy="350" r="0.8"/><circle cx="640" cy="280" r="1.0"/><circle cx="780" cy="400" r="0.7"/>
    <circle cx="880" cy="320" r="1.2"/><circle cx="1000" cy="450" r="0.9"/><circle cx="1150" cy="380" r="0.6"/>
    <circle cx="150" cy="500" r="1.0"/><circle cx="270" cy="580" r="0.7"/><circle cx="400" cy="490" r="0.8"/>
    <circle cx="550" cy="620" r="1.1"/><circle cx="700" cy="530" r="0.6"/><circle cx="850" cy="650" r="0.9"/>
    <circle cx="950" cy="560" r="1.0"/><circle cx="1080" cy="700" r="0.8"/><circle cx="60" cy="720" r="0.7"/>
    <circle cx="350" cy="750" r="0.9"/><circle cx="600" cy="780" r="0.6"/><circle cx="900" cy="760" r="1.0"/>
    <circle cx="1150" cy="720" r="0.5"/><circle cx="170" cy="670" r="0.7"/><circle cx="480" cy="710" r="0.8"/>
    <!-- 更远的暗星 -->
    <circle cx="30" cy="160" r="0.4" opacity="0.5"/><circle cx="290" cy="420" r="0.5" opacity="0.5"/>
    <circle cx="450" cy="100" r="0.4" opacity="0.5"/><circle cx="720" cy="680" r="0.5" opacity="0.5"/>
    <circle cx="810" cy="240" r="0.4" opacity="0.5"/><circle cx="1020" cy="600" r="0.5" opacity="0.5"/>
    <circle cx="170" cy="220" r="0.5" opacity="0.5"/><circle cx="620" cy="450" r="0.4" opacity="0.5"/>
    <circle cx="520" cy="510" r="0.5" opacity="0.5"/><circle cx="960" cy="130" r="0.4" opacity="0.5"/>
    <circle cx="110" cy="450" r="0.5" opacity="0.5"/><circle cx="380" cy="640" r="0.4" opacity="0.5"/>
    <circle cx="760" cy="730" r="0.5" opacity="0.5"/><circle cx="1040" cy="280" r="0.4" opacity="0.5"/>
  </g>

  <!-- 北斗七星连线和星点 -->
  <g filter="url(#starGlow)">
    <!-- 连线 -->
    <g stroke="#fbbf24" stroke-width="1.2" opacity="0.25" stroke-dasharray="4 6" fill="none">
      <!-- 天枢→天璇→天玑→天权→玉衡→开阳→摇光 -->
      <line x1="750" y1="420" x2="800" y2="450"/>
      <line x1="800" y1="450" x2="860" y2="470"/>
      <line x1="860" y1="470" x2="900" y2="520"/>
      <line x1="900" y1="520" x2="830" y2="560"/>
      <line x1="830" y1="560" x2="860" y2="630"/>
      <!-- 辅星（开阳双星）延伸线 -->
      <line x1="860" y1="630" x2="890" y2="650"/>
      <!-- 天枢→北极星虚线 -->
      <line x1="750" y1="420" x2="760" y2="200" opacity="0.15" stroke-dasharray="2 8"/>
    </g>
    <g stroke="#fcd34d" stroke-width="0.8" opacity="0.35" fill="none">
      <line x1="750" y1="420" x2="800" y2="450"/>
      <line x1="800" y1="450" x2="860" y2="470"/>
      <line x1="860" y1="470" x2="900" y2="520"/>
      <line x1="900" y1="520" x2="830" y2="560"/>
      <line x1="830" y1="560" x2="860" y2="630"/>
      <line x1="860" y1="630" x2="890" y2="650"/>
    </g>

    <!-- 星点（从勺头到勺柄） -->
    <!-- 天枢（α UMa, Dubhe）= 贪狼 -->
    <circle cx="750" cy="420" r="4" fill="#fbbf24" opacity="0.9"/>
    <circle cx="750" cy="420" r="8" fill="url(#glow)" opacity="0.4"/>

    <!-- 天璇（β UMa, Merak）= 巨门 -->
    <circle cx="800" cy="450" r="3.5" fill="#fbbf24" opacity="0.85"/>
    <circle cx="800" cy="450" r="7" fill="url(#glow)" opacity="0.35"/>

    <!-- 天玑（γ UMa, Phecda）= 禄存 -->
    <circle cx="860" cy="470" r="3.5" fill="#fbbf24" opacity="0.85"/>
    <circle cx="860" cy="470" r="7" fill="url(#glow)" opacity="0.35"/>

    <!-- 天权（δ UMa, Megrez）= 文曲 -->
    <circle cx="900" cy="520" r="3" fill="#fbbf24" opacity="0.75"/>
    <circle cx="900" cy="520" r="6" fill="url(#glow)" opacity="0.3"/>

    <!-- 玉衡（ε UMa, Alioth）= 廉贞 -->
    <circle cx="830" cy="560" r="4.5" fill="#fbbf24" opacity="0.95"/>
    <circle cx="830" cy="560" r="9" fill="url(#glow)" opacity="0.5"/>

    <!-- 开阳（ζ UMa, Mizar）= 武曲 -->
    <circle cx="860" cy="630" r="3.5" fill="#fbbf24" opacity="0.8"/>
    <circle cx="860" cy="630" r="7" fill="url(#glow)" opacity="0.35"/>

    <!-- 辅（Alcor）= 破军（开阳伴星） -->
    <circle cx="890" cy="650" r="2.5" fill="#fcd34d" opacity="0.6"/>
    <circle cx="890" cy="650" r="5" fill="url(#glow)" opacity="0.25"/>

    <!-- 摇光（η UMa, Alkaid）= 破军 -->
    <circle cx="920" cy="690" r="3" fill="#fbbf24" opacity="0.75"/>
    <circle cx="920" cy="690" r="6" fill="url(#glow)" opacity="0.3"/>
  </g>

  <!-- 北极星 -->
  <g filter="url(#starGlow)">
    <circle cx="760" cy="200" r="5" fill="#fef3c7" opacity="0.95"/>
    <circle cx="760" cy="200" r="10" fill="url(#glow)" opacity="0.6"/>
    <circle cx="760" cy="200" r="16" fill="url(#glow)" opacity="0.25"/>
    <!-- 北极星十字光芒 -->
    <line x1="760" y1="185" x2="760" y2="215" stroke="#fef3c7" stroke-width="0.8" opacity="0.4"/>
    <line x1="745" y1="200" x2="775" y2="200" stroke="#fef3c7" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- 八卦图虚影（右下角，极淡） -->
  <g transform="translate(1050, 650) scale(0.8)" opacity="0.04">
    <circle cx="50" cy="50" r="50" stroke="#fbbf24" stroke-width="2"/>
    <path d="M50,0 A25,25 0 0,1 50,50 A25,25 0 0,0 50,100 A50,50 0 0,1 50,0" fill="#fbbf24"/>
    <circle cx="50" cy="25" r="8" fill="#0a0a0f"/>
    <circle cx="50" cy="75" r="8" fill="#fbbf24"/>
  </g>
</svg>
