<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" fill="none">
  <defs>
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="blur2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="40" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="beidouHalo" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fcd34d" stop-opacity="0.30"/>
      <stop offset="30%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="polarisHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fefce8" stop-opacity="0.40"/>
      <stop offset="25%" stop-color="#fef3c7" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#fbbf24" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="goldHalo" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.2"/>
      <stop offset="30%" stop-color="#fbbf24" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="35%" stop-color="#08081a"/>
      <stop offset="65%" stop-color="#0d0d24"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
  </defs>

  <!-- 深空底色 -->
  <rect width="1440" height="900" fill="url(#skyGrad)"/>

  <!-- === 中央北斗七星大光晕 === -->
  <ellipse cx="600" cy="440" rx="450" ry="350" fill="url(#beidouHalo)"/>

  <!-- === 北极星区域光晕（在北斗上方）=== -->
  <circle cx="570" cy="160" r="220" fill="url(#polarisHalo)"/>

  <!-- === 四周辅助光晕 === -->
  <circle cx="200" cy="200" r="180" fill="url(#goldHalo)" opacity="0.5"/>
  <circle cx="1250" cy="600" r="220" fill="url(#goldHalo)" opacity="0.4"/>
  <circle cx="400" cy="780" r="160" fill="url(#goldHalo)" opacity="0.3"/>
  <circle cx="1150" cy="200" r="140" fill="url(#goldHalo)" opacity="0.3"/>

  <!-- ===== 散布群星 ===== -->
  <g fill="#fcd34d">
    <!-- 左上区 -->
    <circle cx="50" cy="80" r="1.2" opacity="0.5"/><circle cx="140" cy="40" r="0.8" opacity="0.4"/>
    <circle cx="230" cy="130" r="1.4" opacity="0.55"/><circle cx="350" cy="50" r="0.7" opacity="0.35"/>
    <circle cx="440" cy="160" r="1.1" opacity="0.5"/><circle cx="580" cy="70" r="0.9" opacity="0.4"/>
    <circle cx="120" cy="320" r="0.8" opacity="0.4"/><circle cx="280" cy="250" r="1.0" opacity="0.45"/>
    <!-- 右上区 -->
    <circle cx="900" cy="100" r="0.9" opacity="0.4"/><circle cx="1050" cy="180" r="1.3" opacity="0.55"/>
    <circle cx="1180" cy="80" r="1.0" opacity="0.45"/><circle cx="1300" cy="250" r="0.7" opacity="0.3"/>
    <circle cx="1400" cy="150" r="0.5" opacity="0.25"/><circle cx="980" cy="300" r="0.8" opacity="0.35"/>
    <circle cx="1100" cy="380" r="1.1" opacity="0.5"/><circle cx="1320" cy="450" r="0.9" opacity="0.4"/>
    <!-- 左下区 -->
    <circle cx="80" cy="520" r="1.0" opacity="0.45"/><circle cx="180" cy="630" r="0.7" opacity="0.3"/>
    <circle cx="300" cy="500" r="0.9" opacity="0.4"/><circle cx="420" cy="700" r="1.2" opacity="0.5"/>
    <circle cx="150" cy="780" r="0.8" opacity="0.35"/><circle cx="320" cy="850" r="0.6" opacity="0.25"/>
    <!-- 右下区 -->
    <circle cx="950" cy="650" r="1.0" opacity="0.45"/><circle cx="1100" cy="550" r="0.8" opacity="0.35"/>
    <circle cx="1250" cy="720" r="1.2" opacity="0.5"/><circle cx="1380" cy="600" r="0.7" opacity="0.3"/>
    <circle cx="1050" cy="820" r="0.9" opacity="0.4"/><circle cx="1350" cy="850" r="0.6" opacity="0.25"/>
    <circle cx="800" cy="780" r="0.8" opacity="0.35"/><circle cx="650" cy="820" r="0.5" opacity="0.25"/>
    <!-- 微星（更暗更散） -->
    <circle cx="30" cy="180" r="0.4" opacity="0.25"/><circle cx="380" cy="380" r="0.5" opacity="0.3"/>
    <circle cx="700" cy="130" r="0.4" opacity="0.25"/><circle cx="880" cy="450" r="0.5" opacity="0.3"/>
    <circle cx="480" cy="580" r="0.4" opacity="0.25"/><circle cx="1020" cy="250" r="0.5" opacity="0.3"/>
    <circle cx="200" cy="430" r="0.4" opacity="0.25"/><circle cx="850" cy="700" r="0.5" opacity="0.3"/>
    <circle cx="60" cy="700" r="0.4" opacity="0.25"/><circle cx="1280" cy="350" r="0.5" opacity="0.3"/>
    <circle cx="520" cy="300" r="0.4" opacity="0.25"/><circle cx="1150" cy="900" r="0.5" opacity="0.3"/>
    <circle cx="720" cy="760" r="0.4" opacity="0.25"/><circle cx="400" cy="150" r="0.4" opacity="0.2"/>
    <circle cx="1350" cy="100" r="0.5" opacity="0.2"/><circle cx="250" cy="900" r="0.4" opacity="0.2"/>
  </g>

  <!-- ===== 北斗七星（居中，x偏移-180）===== -->
  <!-- 虚线连线 -->
  <g stroke="#fcd34d" stroke-width="1.2" opacity="0.25" fill="none" stroke-dasharray="5 8">
    <line x1="570" y1="400" x2="620" y2="430"/>
    <line x1="620" y1="430" x2="680" y2="450"/>
    <line x1="680" y1="450" x2="720" y2="500"/>
    <line x1="720" y1="500" x2="650" y2="540"/>
    <line x1="650" y1="540" x2="680" y2="610"/>
    <line x1="680" y1="610" x2="710" y2="630"/>
    <line x1="680" y1="610" x2="740" y2="670"/>
    <!-- 天枢→北极星 -->
    <line x1="570" y1="400" x2="580" y2="160" opacity="0.15" stroke-dasharray="2 10"/>
  </g>

  <!-- ===== 七星星点（带大光晕）===== -->
  <g filter="url(#bigGlow)">
    <!-- 天枢（贪狼） -->
    <circle cx="570" cy="400" r="5" fill="#fef3c7" opacity="0.95"/>
    <circle cx="570" cy="400" r="14" fill="#fbbf24" opacity="0.3"/>
    <circle cx="570" cy="400" r="24" fill="#f59e0b" opacity="0.12"/>

    <!-- 天璇（巨门） -->
    <circle cx="620" cy="430" r="4.5" fill="#fef3c7" opacity="0.9"/>
    <circle cx="620" cy="430" r="12" fill="#fbbf24" opacity="0.25"/>
    <circle cx="620" cy="430" r="20" fill="#f59e0b" opacity="0.1"/>

    <!-- 天玑（禄存） -->
    <circle cx="680" cy="450" r="4.5" fill="#fef3c7" opacity="0.9"/>
    <circle cx="680" cy="450" r="12" fill="#fbbf24" opacity="0.25"/>
    <circle cx="680" cy="450" r="20" fill="#f59e0b" opacity="0.1"/>

    <!-- 天权（文曲） -->
    <circle cx="720" cy="500" r="3.5" fill="#fef3c7" opacity="0.8"/>
    <circle cx="720" cy="500" r="10" fill="#fbbf24" opacity="0.2"/>
    <circle cx="720" cy="500" r="18" fill="#f59e0b" opacity="0.08"/>

    <!-- 玉衡（廉贞）- 最亮 -->
    <circle cx="650" cy="540" r="6" fill="#fefce8" opacity="1"/>
    <circle cx="650" cy="540" r="16" fill="#fbbf24" opacity="0.35"/>
    <circle cx="650" cy="540" r="28" fill="#f59e0b" opacity="0.15"/>

    <!-- 开阳（武曲） -->
    <circle cx="680" cy="610" r="4" fill="#fef3c7" opacity="0.85"/>
    <circle cx="680" cy="610" r="11" fill="#fbbf24" opacity="0.22"/>
    <circle cx="680" cy="610" r="19" fill="#f59e0b" opacity="0.09"/>

    <!-- 辅（破军伴星） -->
    <circle cx="710" cy="630" r="2.5" fill="#fcd34d" opacity="0.65"/>
    <circle cx="710" cy="630" r="7" fill="#fcd34d" opacity="0.15"/>

    <!-- 摇光（破军） -->
    <circle cx="740" cy="670" r="3.5" fill="#fef3c7" opacity="0.8"/>
    <circle cx="740" cy="670" r="10" fill="#fbbf24" opacity="0.2"/>
    <circle cx="740" cy="670" r="18" fill="#f59e0b" opacity="0.08"/>
  </g>

  <!-- ===== 北极星（帝星）===== -->
  <g filter="url(#bigGlow)">
    <circle cx="580" cy="160" r="35" fill="#fef3c7" opacity="0.08"/>
    <circle cx="580" cy="160" r="20" fill="#fef3c7" opacity="0.15"/>
    <circle cx="580" cy="160" r="10" fill="#fefce8" opacity="0.3"/>
    <circle cx="580" cy="160" r="5" fill="#ffffff" opacity="1"/>
    <circle cx="580" cy="160" r="2.5" fill="#ffffff" opacity="1"/>
    <!-- 十字星光 -->
    <line x1="580" y1="145" x2="580" y2="175" stroke="#fefce8" stroke-width="1.2" opacity="0.65"/>
    <line x1="565" y1="160" x2="595" y2="160" stroke="#fefce8" stroke-width="1.2" opacity="0.65"/>
    <!-- 对角 -->
    <line x1="569" y1="149" x2="591" y2="171" stroke="#fefce8" stroke-width="0.6" opacity="0.35"/>
    <line x1="591" y1="149" x2="569" y2="171" stroke="#fefce8" stroke-width="0.6" opacity="0.35"/>
  </g>

  <!-- 右下角淡八卦图 -->
  <g transform="translate(1260, 700) scale(0.7)" opacity="0.035">
    <circle cx="50" cy="50" r="50" stroke="#fbbf24" stroke-width="2"/>
    <path d="M50,0 A25,25 0 0,1 50,50 A25,25 0 0,0 50,100 A50,50 0 0,1 50,0" fill="#fbbf24"/>
    <circle cx="50" cy="25" r="8" fill="#050510"/>
    <circle cx="50" cy="75" r="8" fill="#fbbf24"/>
  </g>
</svg>
