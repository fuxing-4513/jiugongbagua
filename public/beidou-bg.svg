<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" fill="none">
  <defs>
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="beidouHalo" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fcd34d" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="polarisHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fefce8" stop-opacity="0.22"/>
      <stop offset="30%" stop-color="#fef3c7" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="subtleGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="35%" stop-color="#08081a"/>
      <stop offset="65%" stop-color="#0d0d24"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="900" fill="url(#skyGrad)"/>

  <!-- === 中央北斗区域淡光晕（缩小） === -->
  <ellipse cx="720" cy="400" rx="480" ry="320" fill="url(#beidouHalo)"/>

  <!-- === 北极星光晕（缩小） === -->
  <circle cx="680" cy="130" r="140" fill="url(#polarisHalo)"/>

  <!-- === 四周辅助光晕 === -->
  <circle cx="250" cy="250" r="180" fill="url(#subtleGlow)"/>
  <circle cx="1200" cy="600" r="200" fill="url(#subtleGlow)"/>
  <circle cx="350" cy="750" r="150" fill="url(#subtleGlow)"/>

  <!-- ===== 散布群星 ===== -->
  <g fill="#fcd34d">
    <circle cx="50" cy="80" r="1.2" opacity="0.45"/><circle cx="140" cy="40" r="0.8" opacity="0.35"/>
    <circle cx="230" cy="130" r="1.3" opacity="0.5"/><circle cx="350" cy="50" r="0.7" opacity="0.3"/>
    <circle cx="460" cy="160" r="1.0" opacity="0.4"/><circle cx="600" cy="60" r="0.9" opacity="0.35"/>
    <circle cx="120" cy="320" r="0.8" opacity="0.35"/><circle cx="280" cy="250" r="0.9" opacity="0.4"/>
    <circle cx="900" cy="100" r="0.8" opacity="0.35"/><circle cx="1050" cy="180" r="1.2" opacity="0.5"/>
    <circle cx="1180" cy="80" r="0.9" opacity="0.4"/><circle cx="1300" cy="250" r="0.6" opacity="0.25"/>
    <circle cx="1400" cy="150" r="0.5" opacity="0.2"/><circle cx="1020" cy="300" r="0.7" opacity="0.3"/>
    <circle cx="1120" cy="400" r="1.0" opacity="0.45"/><circle cx="1350" cy="450" r="0.8" opacity="0.35"/>
    <circle cx="80" cy="520" r="0.9" opacity="0.4"/><circle cx="180" cy="630" r="0.6" opacity="0.25"/>
    <circle cx="300" cy="500" r="0.8" opacity="0.35"/><circle cx="420" cy="700" r="1.1" opacity="0.45"/>
    <circle cx="160" cy="780" r="0.7" opacity="0.3"/><circle cx="320" cy="850" r="0.5" opacity="0.2"/>
    <circle cx="980" cy="650" r="0.9" opacity="0.4"/><circle cx="1120" cy="560" r="0.7" opacity="0.3"/>
    <circle cx="1280" cy="720" r="1.1" opacity="0.45"/><circle cx="1380" cy="620" r="0.6" opacity="0.25"/>
    <circle cx="1080" cy="820" r="0.8" opacity="0.35"/><circle cx="1350" cy="850" r="0.5" opacity="0.2"/>
    <circle cx="820" cy="780" r="0.7" opacity="0.3"/><circle cx="680" cy="850" r="0.5" opacity="0.2"/>
    <circle cx="30" cy="180" r="0.4" opacity="0.2"/><circle cx="380" cy="380" r="0.4" opacity="0.25"/>
    <circle cx="720" cy="120" r="0.4" opacity="0.2"/><circle cx="900" cy="460" r="0.4" opacity="0.25"/>
    <circle cx="500" cy="600" r="0.4" opacity="0.2"/><circle cx="1050" cy="260" r="0.4" opacity="0.25"/>
    <circle cx="200" cy="440" r="0.4" opacity="0.2"/><circle cx="870" cy="720" r="0.4" opacity="0.25"/>
    <circle cx="60" cy="720" r="0.4" opacity="0.2"/><circle cx="1300" cy="350" r="0.4" opacity="0.25"/>
    <circle cx="540" cy="320" r="0.4" opacity="0.2"/><circle cx="1160" cy="900" r="0.4" opacity="0.25"/>
    <circle cx="750" cy="780" r="0.4" opacity="0.2"/><circle cx="400" cy="160" r="0.4" opacity="0.2"/>
    <circle cx="1380" cy="100" r="0.4" opacity="0.2"/><circle cx="260" cy="900" r="0.4" opacity="0.2"/>
  </g>

  <!-- ===== 北斗七星（拉伸延展，2x 尺度，居中）===== -->
  <!-- 虚线 -->
  <g stroke="#fcd34d" stroke-width="1.2" opacity="0.2" fill="none" stroke-dasharray="5 8">
    <!-- 天枢→天璇→天玑→天权→玉衡→开阳→摇光 -->
    <line x1="500" y1="350" x2="620" y2="400"/>
    <line x1="620" y1="400" x2="720" y2="440"/>
    <line x1="720" y1="440" x2="800" y2="530"/>
    <line x1="800" y1="530" x2="680" y2="600"/>
    <line x1="680" y1="600" x2="720" y2="700"/>
    <line x1="720" y1="700" x2="780" y2="740"/>
    <line x1="720" y1="700" x2="840" y2="780"/>
    <!-- 天枢→北极星 -->
    <line x1="500" y1="350" x2="520" y2="120" opacity="0.12" stroke-dasharray="2 10"/>
  </g>

  <!-- ===== 七星（拉伸大尺寸）===== -->
  <g filter="url(#bigGlow)">
    <!-- 天枢（贪狼） -->
    <circle cx="500" cy="350" r="6" fill="#fef3c7" opacity="0.92"/>
    <circle cx="500" cy="350" r="14" fill="#fbbf24" opacity="0.25"/>

    <!-- 天璇（巨门） -->
    <circle cx="620" cy="400" r="5.5" fill="#fef3c7" opacity="0.88"/>
    <circle cx="620" cy="400" r="12" fill="#fbbf24" opacity="0.22"/>

    <!-- 天玑（禄存） -->
    <circle cx="720" cy="440" r="5.5" fill="#fef3c7" opacity="0.88"/>
    <circle cx="720" cy="440" r="12" fill="#fbbf24" opacity="0.22"/>

    <!-- 天权（文曲） -->
    <circle cx="800" cy="530" r="4.5" fill="#fef3c7" opacity="0.78"/>
    <circle cx="800" cy="530" r="10" fill="#fbbf24" opacity="0.18"/>

    <!-- 玉衡（廉贞）- 最亮 -->
    <circle cx="680" cy="600" r="7" fill="#fefce8" opacity="0.95"/>
    <circle cx="680" cy="600" r="16" fill="#fbbf24" opacity="0.30"/>

    <!-- 开阳（武曲） -->
    <circle cx="720" cy="700" r="5" fill="#fef3c7" opacity="0.82"/>
    <circle cx="720" cy="700" r="11" fill="#fbbf24" opacity="0.20"/>

    <!-- 辅 -->
    <circle cx="780" cy="740" r="3" fill="#fcd34d" opacity="0.6"/>
    <circle cx="780" cy="740" r="7" fill="#fcd34d" opacity="0.12"/>

    <!-- 摇光（破军） -->
    <circle cx="840" cy="780" r="4.5" fill="#fef3c7" opacity="0.78"/>
    <circle cx="840" cy="780" r="10" fill="#fbbf24" opacity="0.18"/>
  </g>

  <!-- ===== 北极星（缩小光晕）===== -->
  <g filter="url(#bigGlow)">
    <circle cx="520" cy="120" r="18" fill="#fef3c7" opacity="0.10"/>
    <circle cx="520" cy="120" r="10" fill="#fef3c7" opacity="0.18"/>
    <circle cx="520" cy="120" r="5" fill="#fefce8" opacity="0.35"/>
    <circle cx="520" cy="120" r="3" fill="#ffffff" opacity="1"/>
    <circle cx="520" cy="120" r="1.5" fill="#ffffff" opacity="1"/>
    <line x1="520" y1="108" x2="520" y2="132" stroke="#fefce8" stroke-width="1" opacity="0.55"/>
    <line x1="508" y1="120" x2="532" y2="120" stroke="#fefce8" stroke-width="1" opacity="0.55"/>
  </g>

  <!-- 右下角八卦 -->
  <g transform="translate(1260, 700) scale(0.7)" opacity="0.03">
    <circle cx="50" cy="50" r="50" stroke="#fbbf24" stroke-width="2"/>
    <path d="M50,0 A25,25 0 0,1 50,50 A25,25 0 0,0 50,100 A50,50 0 0,1 50,0" fill="#fbbf24"/>
    <circle cx="50" cy="25" r="8" fill="#050510"/>
    <circle cx="50" cy="75" r="8" fill="#fbbf24"/>
  </g>
</svg>
