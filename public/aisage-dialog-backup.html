<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>九宫玄学 AI 问一问</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    /* ── 折叠头 ── */
    details {
      background: linear-gradient(135deg, rgba(5, 150, 105, 0.12), rgba(5, 150, 105, 0.06));
      border: 1px solid rgba(5, 150, 105, 0.25);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    details[open] {
      border-color: rgba(5, 150, 105, 0.4);
    }

    summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      cursor: pointer;
      list-style: none;
      user-select: none;
      transition: background 0.2s;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    summary:hover {
      background: rgba(5, 150, 105, 0.06);
    }

    .summary-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .summary-icon {
      font-size: 22px;
    }

    .summary-title {
      font-size: 14px;
      font-weight: 600;
      color: #5eead4;
    }

    .summary-subtitle {
      font-size: 11px;
      color: #6b7280;
    }

    .summary-arrow {
      color: #34d399;
      transition: transform 0.2s;
      font-size: 12px;
    }

    details[open] .summary-arrow {
      transform: rotate(180deg);
    }

    /* ── 聊天区域 ── */
    .chat-area {
      border-top: 1px solid rgba(5, 150, 105, 0.15);
    }

    .messages {
      height: 320px;
      overflow-y: auto;
      padding: 12px 16px;
      background: rgba(13, 17, 23, 0.9);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .messages::-webkit-scrollbar {
      width: 4px;
    }

    .messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .messages::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 4px;
    }

    .message {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.5;
    }

    .message-user {
      align-self: flex-end;
      background: rgba(5, 150, 105, 0.15);
      border: 1px solid rgba(5, 150, 105, 0.25);
      color: #a7f3d0;
    }

    .message-ai {
      align-self: flex-start;
      background: rgba(31, 41, 55, 0.7);
      border: 1px solid rgba(55, 65, 81, 0.5);
      color: #e5e7eb;
    }

    .message-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .message-header .badge {
      font-size: 9px;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(5, 150, 105, 0.2);
      color: #34d399;
      border: 1px solid rgba(5, 150, 105, 0.3);
    }

    .message p {
      font-size: 13px;
      margin-bottom: 4px;
    }

    .message p:last-child {
      margin-bottom: 0;
    }

    .message li {
      margin-left: 12px;
      font-size: 13px;
    }

    /* ── 加载动画 ── */
    .loading-dots {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #9ca3af;
      font-size: 12px;
    }

    .loading-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34d399;
      animation: pulse 1.2s infinite;
    }

    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* ── 错误 ── */
    .error-msg {
      text-align: center;
      background: rgba(220, 38, 38, 0.15);
      border: 1px solid rgba(220, 38, 38, 0.25);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      color: #fca5a5;
    }

    /* ── 底部 ── */
    .footer {
      background: rgba(13, 17, 23, 0.9);
      padding: 10px 16px;
      border-top: 1px solid rgba(55, 65, 81, 0.35);
    }

    .quick-topics {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      margin-bottom: 10px;
      padding-bottom: 2px;
    }

    .quick-topics::-webkit-scrollbar { height: 0; }

    .topic-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(31, 41, 55, 0.6);
      border: 1px solid rgba(55, 65, 81, 0.4);
      color: #9ca3af;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s;
    }

    .topic-btn:hover {
      border-color: rgba(5, 150, 105, 0.4);
      color: #5eead4;
      background: rgba(5, 150, 105, 0.08);
    }

    .topic-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .input-row input {
      flex: 1;
      background: rgba(31, 41, 55, 0.7);
      border: 1px solid rgba(55, 65, 81, 0.5);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 14px;
      color: #e5e7eb;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input:focus {
      border-color: rgba(5, 150, 105, 0.5);
      box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.1);
    }

    .input-row input::placeholder {
      color: #6b7280;
    }

    .send-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: rgba(5, 150, 105, 0.15);
      border: 1px solid rgba(5, 150, 105, 0.25);
      color: #34d399;
      cursor: pointer;
      transition: background 0.15s;
    }

    .send-btn:hover:not(:disabled) {
      background: rgba(5, 150, 105, 0.25);
    }

    .send-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .footer-note {
      text-align: center;
      font-size: 9px;
      color: #4b5563;
      margin-top: 6px;
    }

    /* ── 内联方式弹窗样式 ── */
    .fixed-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #059669, #047857);
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(5, 150, 105, 0.35);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }

    .fixed-btn:hover {
      transform: scale(1.08);
    }

    .fixed-btn:active {
      transform: scale(0.95);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 480px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>

  <!-- 浮动按钮 -->
  <button class="fixed-btn" id="openBtn" title="玄学 AI 问一问">🧿</button>

  <!-- 弹窗 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <div class="container">
        <details open id="chatDetails">
          <summary>
            <div class="summary-left">
              <span class="summary-icon">🧿</span>
              <div>
                <div class="summary-title">玄学 AI 问一问</div>
                <div class="summary-subtitle">八字 · 紫微 · 奇门 · 六爻 · 姓名 · 风水 · 解梦 · 择日</div>
              </div>
            </div>
            <span class="summary-arrow">▼</span>
          </summary>
          <div class="chat-area">
            <div class="messages" id="messages">
              <!-- 欢迎消息 -->
              <div class="message message-ai">
                <div class="message-header">
                  🧿 九宫先生
                  <span class="badge">全科</span>
                </div>
                <p>你好！我是九宫先生，精通八字、紫微斗数、奇门遁甲、六爻、梅花易数、姓名学、风水堪舆等多个玄学领域。</p>
                <p style="margin-top:6px;">你可以问我任何问题，比如：</p>
                <p>• "我最近事业不顺，帮我看看怎么回事？"</p>
                <p>• "我适合改名吗？需要注意什么？"</p>
                <p>• "这个投资项目能成吗？"</p>
                <p>• "帮我分析一下我家风水布局"</p>
                <p>• "周公解梦——梦见掉牙齿"</p>
                <p style="margin-top:6px;">无需选择领域，直接提问即可。😊</p>
              </div>
            </div>
            <div class="footer">
              <!-- 快捷话题 -->
              <div class="quick-topics" id="quickTopics"></div>
              <!-- 输入框 -->
              <div class="input-row">
                <input type="text" id="chatInput" placeholder="问一个玄学问题..." autocomplete="off">
                <button class="send-btn" id="sendBtn" title="发送">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                  </svg>
                </button>
              </div>
              <div class="footer-note">AI 回复仅供参考 · 命运在自己手中 🪷</div>
            </div>
          </div>
        </details>
      </div>
    </div>
  </div>

  <script>
    // ── 配置 ──
    // API 地址：本地开发用 WSL 地址，生产用 Cloudflare Worker
    const DEV_MODE = location.hostname === '172.23.127.193' || location.hostname === 'localhost';
    const API_URL = window.location.origin

    const QUICK_TOPICS = [
      { emoji: '📜', label: '八字分析', prompt: '给我介绍一下四柱八字是怎么看命的，每柱代表什么' },
      { emoji: '⭐', label: '紫微斗数', prompt: '紫微斗数怎么看一个人的财运？主要看哪个宫位？' },
      { emoji: '☯', label: '六爻占卜', prompt: '六爻占卜是怎么起卦的？爻辞怎么看吉凶？' },
      { emoji: '🌀', label: '奇门遁甲', prompt: '奇门遁甲中的八门各自代表什么？怎么判断吉凶？' },
      { emoji: '🌸', label: '梅花易数', prompt: '梅花易数的时间起卦法是怎么算的？' },
      { emoji: '📝', label: '姓名学', prompt: '姓名五格剖象法中，人格和地格哪个更重要？' },
      { emoji: '🧭', label: '风水布局', prompt: '居家风水入门——客厅和卧室有哪些基本禁忌？' },
    ];

    // ── DOM ──
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const openBtn = document.getElementById('openBtn');
    const overlay = document.getElementById('modalOverlay');
    const topicsEl = document.getElementById('quickTopics');

    let loading = false;

    // ── 快捷话题 ──
    QUICK_TOPICS.forEach(t => {
      const btn = document.createElement('button');
      btn.className = 'topic-btn';
      btn.innerHTML = `<span>${t.emoji}</span><span>${t.label}</span>`;
      btn.onclick = () => sendMessage(t.prompt);
      topicsEl.appendChild(btn);
    });

    // ── 发送消息 ──
    async function sendMessage(text) {
      text = text.trim();
      if (!text || loading) return;

      // 用户消息
      addMessage(text, 'user');
      inputEl.value = '';
      loading = true;
      setUIState(true);

      // 显示加载
      const loadingId = showLoading();

      try {
        const res = await fetch(API_URL + '/aisage/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: Array.from(messagesEl.querySelectorAll('.message'))
              .map(el => {
                const isAi = el.classList.contains('message-ai');
                // 跳过加载中、错误消息
                if (el.dataset.role === 'loading' || el.dataset.role === 'error') return null;
                const content = el.querySelector('.content-text');
                return content ? { role: isAi ? 'assistant' : 'user', content: content.textContent } : null;
              })
              .filter(Boolean)
              .concat([{ role: 'user', content: text }])
          })
        });

        // 移除加载
        removeLoading(loadingId);

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.message || '请求失败');
        }

        const data = await res.json();
        addMessage(data.reply, 'ai');
      } catch (err) {
        removeLoading(loadingId);
        showError(err.message || 'AI 服务调用失败');
      } finally {
        loading = false;
        setUIState(false);
        inputEl.focus();
      }
    }

    // ── 添加消息 ──
    function addMessage(content, role) {
      const div = document.createElement('div');
      div.className = 'message ' + (role === 'user' ? 'message-user' : 'message-ai');

      if (role === 'ai') {
        div.innerHTML = `
          <div class="message-header">
            🧿 九宫先生
            <span class="badge">全科</span>
          </div>
          <div class="content-text"></div>
        `;
      } else {
        div.innerHTML = `
          <div class="message-header">👤 你</div>
          <div class="content-text"></div>
        `;
      }

      const contentDiv = div.querySelector('.content-text');
      // 解析换行和列表
      content.split('\n').forEach(line => {
        if (!line.trim()) {
          contentDiv.appendChild(document.createElement('br'));
        } else if (line.trim().startsWith('•') || line.trim().startsWith('-') || /^\d+[.、]/.test(line.trim())) {
          const p = document.createElement('p');
          p.style.marginLeft = '12px';
          p.textContent = line.trim();
          contentDiv.appendChild(p);
        } else {
          const p = document.createElement('p');
          p.textContent = line;
          contentDiv.appendChild(p);
        }
      });

      messagesEl.appendChild(div);
      scrollToBottom();
    }

    // ── 加载动画 ──
    function showLoading() {
      const id = 'loading-' + Date.now();
      const div = document.createElement('div');
      div.className = 'message message-ai';
      div.dataset.role = 'loading';
      div.id = id;
      div.innerHTML = `
        <div class="loading-dots">
          <span></span><span></span><span></span>
          <span style="margin-left:4px;">正在思考...</span>
        </div>
      `;
      messagesEl.appendChild(div);
      scrollToBottom();
      return id;
    }

    function removeLoading(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    // ── 错误 ──
    function showError(msg) {
      const div = document.createElement('div');
      div.className = 'error-msg';
      div.dataset.role = 'error';
      div.textContent = '⚠️ ' + msg;
      messagesEl.appendChild(div);
      scrollToBottom();
    }

    // ── UI 状态 ──
    function setUIState(disabled) {
      inputEl.disabled = disabled;
      sendBtn.disabled = disabled;
      document.querySelectorAll('.topic-btn').forEach(b => b.disabled = disabled);
    }

    // ── 自动滚动 ──
    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // ── 事件 ──
    sendBtn.onclick = () => sendMessage(inputEl.value);
    inputEl.onkeydown = (e) => { if (e.key === 'Enter') sendMessage(inputEl.value); };

    // ── 弹窗 ──
    openBtn.onclick = () => {
      overlay.classList.add('open');
      setTimeout(() => inputEl.focus(), 200);
    };

    overlay.onclick = (e) => {
      if (e.target === overlay) overlay.classList.remove('open');
    };

    // 自动聚焦
    inputEl.focus();

    console.log('🧿 九宫玄学 AI 已加载');
    console.log('📡 API:', API_URL);
  </script>
</body>
</html>
