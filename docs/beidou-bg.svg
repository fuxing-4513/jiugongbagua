<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" fill="none">
  <defs>
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="beidouHalo" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fcd34d" stop-opacity="0.08"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="polarisHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fefce8" stop-opacity="0.10"/>
      <stop offset="30%" stop-color="#fef3c7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="subtleGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.04"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebula1" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3b2f6e" stop-opacity="0.04"/>
      <stop offset="50%" stop-color="#1a1a4e" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebula2" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020208"/>
      <stop offset="35%" stop-color="#040418"/>
      <stop offset="65%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#05050a"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="900" fill="url(#skyGrad)"/>

  <!-- === 星云/深空效果 === -->
  <ellipse cx="500" cy="300" rx="400" ry="250" fill="url(#nebula1)"/>
  <ellipse cx="1000" cy="550" rx="350" ry="200" fill="url(#nebula2)"/>
  <ellipse cx="300" cy="700" rx="300" ry="180" fill="url(#nebula2)"/>

  <!-- === 暗蓝色微星层（极远星）=== -->
  <g fill="#6b8cce">
    <circle cx="80" cy="45" r="0.4" opacity="0.22"/><circle cx="190" cy="90" r="0.3" opacity="0.18"/>
    <circle cx="320" cy="30" r="0.5" opacity="0.25"/><circle cx="450" cy="100" r="0.3" opacity="0.15"/>
    <circle cx="560" cy="55" r="0.4" opacity="0.20"/><circle cx="680" cy="85" r="0.3" opacity="0.18"/>
    <circle cx="820" cy="40" r="0.5" opacity="0.22"/><circle cx="950" cy="120" r="0.3" opacity="0.16"/>
    <circle cx="1100" cy="60" r="0.4" opacity="0.20"/><circle cx="1250" cy="90" r="0.3" opacity="0.18"/>
    <circle cx="1370" cy="50" r="0.4" opacity="0.15"/><circle cx="150" cy="200" r="0.3" opacity="0.20"/>
    <circle cx="380" cy="180" r="0.4" opacity="0.22"/><circle cx="620" cy="150" r="0.3" opacity="0.18"/>
    <circle cx="870" cy="200" r="0.5" opacity="0.25"/><circle cx="1040" cy="150" r="0.3" opacity="0.15"/>
    <circle cx="1200" cy="250" r="0.4" opacity="0.20"/><circle cx="1380" cy="300" r="0.4" opacity="0.18"/>
    <circle cx="100" cy="420" r="0.3" opacity="0.22"/><circle cx="280" cy="350" r="0.4" opacity="0.20"/>
    <circle cx="460" cy="400" r="0.3" opacity="0.18"/><circle cx="650" cy="320" r="0.5" opacity="0.25"/>
    <circle cx="790" cy="430" r="0.3" opacity="0.15"/><circle cx="920" cy="500" r="0.4" opacity="0.22"/>
    <circle cx="1080" cy="380" r="0.3" opacity="0.18"/><circle cx="1300" cy="500" r="0.4" opacity="0.20"/>
    <circle cx="60" cy="600" r="0.4" opacity="0.22"/><circle cx="220" cy="550" r="0.3" opacity="0.18"/>
    <circle cx="380" cy="650" r="0.5" opacity="0.25"/><circle cx="530" cy="580" r="0.3" opacity="0.15"/>
    <circle cx="710" cy="680" r="0.4" opacity="0.20"/><circle cx="880" cy="620" r="0.3" opacity="0.18"/>
    <circle cx="1050" cy="700" r="0.4" opacity="0.22"/><circle cx="1200" cy="650" r="0.3" opacity="0.15"/>
    <circle cx="140" cy="820" r="0.4" opacity="0.20"/><circle cx="340" cy="780" r="0.3" opacity="0.18"/>
    <circle cx="620" cy="850" r="0.5" opacity="0.25"/><circle cx="830" cy="800" r="0.3" opacity="0.15"/>
  </g>

  <!-- === 紫/白微亮星层（中等距离）=== -->
  <g fill="#c4b5fd">
    <circle cx="110" cy="70" r="1.2" opacity="0.30"/><circle cx="290" cy="160" r="1.5" opacity="0.35"/>
    <circle cx="440" cy="50" r="1.0" opacity="0.25"/><circle cx="610" cy="120" r="1.3" opacity="0.32"/>
    <circle cx="780" cy="70" r="1.1" opacity="0.28"/><circle cx="1030" cy="90" r="1.6" opacity="0.38"/>
    <circle cx="1180" cy="170" r="1.2" opacity="0.30"/><circle cx="1340" cy="130" r="1.4" opacity="0.35"/>
    <circle cx="170" cy="350" r="1.3" opacity="0.32"/><circle cx="350" cy="280" r="1.1" opacity="0.28"/>
    <circle cx="530" cy="380" r="1.5" opacity="0.35"/><circle cx="730" cy="290" r="1.2" opacity="0.30"/>
    <circle cx="990" cy="350" r="1.4" opacity="0.33"/><circle cx="1160" cy="430" r="1.0" opacity="0.25"/>
    <circle cx="90" cy="550" r="1.3" opacity="0.32"/><circle cx="270" cy="620" r="1.1" opacity="0.28"/>
    <circle cx="470" cy="680" r="1.6" opacity="0.38"/><circle cx="690" cy="580" r="1.2" opacity="0.30"/>
    <circle cx="850" cy="700" r="1.4" opacity="0.33"/><circle cx="1100" cy="620" r="1.8" opacity="0.40"/>
    <circle cx="1280" cy="580" r="1.2" opacity="0.30"/>
  </g>

  <!-- === 中央北斗区域淡光晕（缩小后）=== -->
  <ellipse cx="720" cy="400" rx="480" ry="320" fill="url(#beidouHalo)"/>

  <!-- === 北极星光晕（缩小后）=== -->
  <circle cx="680" cy="130" r="140" fill="url(#polarisHalo)"/>

  <!-- === 四周辅助光晕 === -->
  <circle cx="250" cy="250" r="180" fill="url(#subtleGlow)"/>
  <circle cx="1200" cy="600" r="200" fill="url(#subtleGlow)"/>
  <circle cx="350" cy="750" r="150" fill="url(#subtleGlow)"/>

  <!-- ===== 散布金色群星（近处亮星）===== -->
  <g fill="#fcd34d">
    <circle cx="50" cy="80" r="1.2" opacity="0.45"/><circle cx="140" cy="40" r="0.8" opacity="0.35"/>
    <circle cx="230" cy="130" r="1.3" opacity="0.5"/><circle cx="350" cy="50" r="0.7" opacity="0.3"/>
    <circle cx="460" cy="160" r="1.0" opacity="0.4"/><circle cx="600" cy="60" r="0.9" opacity="0.35"/>
    <circle cx="120" cy="320" r="0.8" opacity="0.35"/><circle cx="280" cy="250" r="0.9" opacity="0.4"/>
    <circle cx="900" cy="100" r="0.8" opacity="0.35"/><circle cx="1050" cy="180" r="1.2" opacity="0.5"/>
    <circle cx="1180" cy="80" r="0.9" opacity="0.4"/><circle cx="1300" cy="250" r="0.6" opacity="0.25"/>
    <circle cx="1400" cy="150" r="0.5" opacity="0.2"/><circle cx="1020" cy="300" r="0.7" opacity="0.3"/>
    <circle cx="1120" cy="400" r="1.0" opacity="0.45"/><circle cx="1350" cy="450" r="0.8" opacity="0.35"/>
    <circle cx="80" cy="520" r="0.9" opacity="0.4"/><circle cx="180" cy="630" r="0.6" opacity="0.25"/>
    <circle cx="300" cy="500" r="0.8" opacity="0.35"/><circle cx="420" cy="700" r="1.1" opacity="0.45"/>
    <circle cx="160" cy="780" r="0.7" opacity="0.3"/><circle cx="320" cy="850" r="0.5" opacity="0.2"/>
    <circle cx="980" cy="650" r="0.9" opacity="0.4"/><circle cx="1120" cy="560" r="0.7" opacity="0.3"/>
    <circle cx="1280" cy="720" r="1.1" opacity="0.45"/><circle cx="1380" cy="620" r="0.6" opacity="0.25"/>
    <circle cx="1080" cy="820" r="0.8" opacity="0.35"/><circle cx="1350" cy="850" r="0.5" opacity="0.2"/>
    <circle cx="820" cy="780" r="0.7" opacity="0.3"/><circle cx="680" cy="850" r="0.5" opacity="0.2"/>
    <circle cx="30" cy="180" r="0.4" opacity="0.2"/><circle cx="380" cy="380" r="0.4" opacity="0.25"/>
    <circle cx="720" cy="120" r="0.4" opacity="0.2"/><circle cx="900" cy="460" r="0.4" opacity="0.25"/>
    <circle cx="500" cy="600" r="0.4" opacity="0.2"/><circle cx="1050" cy="260" r="0.4" opacity="0.25"/>
    <circle cx="200" cy="440" r="0.4" opacity="0.2"/><circle cx="870" cy="720" r="0.4" opacity="0.25"/>
    <circle cx="60" cy="720" r="0.4" opacity="0.2"/><circle cx="1300" cy="350" r="0.4" opacity="0.25"/>
    <circle cx="540" cy="320" r="0.4" opacity="0.2"/><circle cx="1160" cy="900" r="0.4" opacity="0.25"/>
    <circle cx="750" cy="780" r="0.4" opacity="0.2"/><circle cx="400" cy="160" r="0.4" opacity="0.2"/>
    <circle cx="1380" cy="100" r="0.4" opacity="0.2"/><circle cx="260" cy="900" r="0.4" opacity="0.2"/>
  </g>

  <!-- ===== 北斗七星虚线 ===== -->
  <g stroke="#fcd34d" stroke-width="1.0" opacity="0.15" fill="none" stroke-dasharray="5 8">
    <line x1="500" y1="350" x2="620" y2="400"/>
    <line x1="620" y1="400" x2="720" y2="440"/>
    <line x1="720" y1="440" x2="800" y2="530"/>
    <line x1="800" y1="530" x2="680" y2="600"/>
    <line x1="680" y1="600" x2="720" y2="700"/>
    <line x1="720" y1="700" x2="780" y2="740"/>
    <line x1="720" y1="700" x2="840" y2="780"/>
    <line x1="500" y1="350" x2="520" y2="120" opacity="0.10" stroke-dasharray="2 10"/>
  </g>

  <!-- ===== 北斗七星（光晕缩小版）===== -->
  <g filter="url(#bigGlow)">
    <!-- 天枢（贪狼） -->
    <circle cx="500" cy="350" r="4.5" fill="#fef3c7" opacity="0.85"/>
    <circle cx="500" cy="350" r="9" fill="#fbbf24" opacity="0.16"/>

    <!-- 天璇（巨门） -->
    <circle cx="620" cy="400" r="4" fill="#fef3c7" opacity="0.80"/>
    <circle cx="620" cy="400" r="8" fill="#fbbf24" opacity="0.14"/>

    <!-- 天玑（禄存） -->
    <circle cx="720" cy="440" r="4" fill="#fef3c7" opacity="0.80"/>
    <circle cx="720" cy="440" r="8" fill="#fbbf24" opacity="0.14"/>

    <!-- 天权（文曲） -->
    <circle cx="800" cy="530" r="3.5" fill="#fef3c7" opacity="0.70"/>
    <circle cx="800" cy="530" r="7" fill="#fbbf24" opacity="0.12"/>

    <!-- 玉衡（廉贞）- 最亮但缩小 -->
    <circle cx="680" cy="600" r="5" fill="#fefce8" opacity="0.90"/>
    <circle cx="680" cy="600" r="10" fill="#fbbf24" opacity="0.20"/>

    <!-- 开阳（武曲） -->
    <circle cx="720" cy="700" r="3.8" fill="#fef3c7" opacity="0.75"/>
    <circle cx="720" cy="700" r="7" fill="#fbbf24" opacity="0.13"/>

    <!-- 辅 -->
    <circle cx="780" cy="740" r="2.5" fill="#fcd34d" opacity="0.50"/>
    <circle cx="780" cy="740" r="5" fill="#fcd34d" opacity="0.08"/>

    <!-- 摇光（破军） -->
    <circle cx="840" cy="780" r="3.5" fill="#fef3c7" opacity="0.70"/>
    <circle cx="840" cy="780" r="7" fill="#fbbf24" opacity="0.12"/>
  </g>

  <!-- ===== 北极星（光晕缩小版）===== -->
  <g filter="url(#bigGlow)">
    <circle cx="520" cy="120" r="12" fill="#fef3c7" opacity="0.06"/>
    <circle cx="520" cy="120" r="7" fill="#fef3c7" opacity="0.12"/>
    <circle cx="520" cy="120" r="3.5" fill="#fefce8" opacity="0.25"/>
    <circle cx="520" cy="120" r="2" fill="#ffffff" opacity="0.90"/>
    <circle cx="520" cy="120" r="1" fill="#ffffff" opacity="1"/>
    <line x1="520" y1="110" x2="520" y2="130" stroke="#fefce8" stroke-width="0.8" opacity="0.35"/>
    <line x1="510" y1="120" x2="530" y2="120" stroke="#fefce8" stroke-width="0.8" opacity="0.35"/>
  </g>

  <!-- 右下角八卦（极淡） -->
  <g transform="translate(1260, 700) scale(0.7)" opacity="0.03">
    <circle cx="50" cy="50" r="50" stroke="#fbbf24" stroke-width="2"/>
    <path d="M50,0 A25,25 0 0,1 50,50 A25,25 0 0,0 50,100 A50,50 0 0,1 50,0" fill="#fbbf24"/>
    <circle cx="50" cy="25" r="8" fill="#050510"/>
    <circle cx="50" cy="75" r="8" fill="#fbbf24"/>
  </g>
</svg>
